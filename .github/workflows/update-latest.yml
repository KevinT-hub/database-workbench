name: Update latest.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Regenerate latest.json from the latest release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITHUB_OWNER: KevinT-hub
      GITHUB_REPO: database-workbench
      GITEE_OWNER: kevint-hub
      GITEE_REPO: database-workbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate latest.json from latest GitHub release
        run: node scripts/update-latest.mjs --from-release

      - name: Upload to GitHub update channel
        run: |
          gh release create update \
            --title "Auto-update channel" \
            --notes "Auto-generated latest.json for the stable update channel." \
            --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload update latest.json --clobber

      - name: Mirror to Gitee update channel
        run: |
          node scripts/gitee-release.mjs \
            --tag update \
            --dir update-gitee \
            --title "Auto-update channel" \
            --notes "Auto-generated latest.json for the stable update channel."
