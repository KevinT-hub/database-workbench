name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(jq -r .version package.json)
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          PRERELEASE="false"
          case "${TAG,,}" in
            *-alpha*|*-beta*|*-rc*|*-preview*|*-dev*) PRERELEASE="true" ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if [ "${GITHUB_REF_NAME,,}" != "v${PKG_VERSION,,}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: [check-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: darwin-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles (with updater signatures)
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Disambiguate macOS updater artifacts
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin) ARCH=x64 ;;
          esac
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          for src in *.app.tar.gz; do
            base="${src%.app.tar.gz}"
            mv "$src" "${base}_${VERSION}_${ARCH}.app.tar.gz"
          done
          for src in *.app.tar.gz.sig; do
            base="${src%.app.tar.gz.sig}"
            mv "$src" "${base}_${VERSION}_${ARCH}.app.tar.gz.sig"
          done

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig

  release:
    name: Publish GitHub release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: KevinT-hub
      GITHUB_REPO: database-workbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: find artifacts -type f -printf '%P\n' | sort

      - name: Ensure updater release exists
        if: needs.check-version.outputs.prerelease == 'false'
        run: |
          gh release create update \
            --title "updater" \
            --notes "Release for maintaining latest.json." \
            --target "$GITHUB_SHA" 2>/dev/null || true

      - name: Create GitHub release
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          PRERELEASE="${{ needs.check-version.outputs.prerelease }}"
          EXTRA_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          NOTES_FILE=""
          if [ -f "RELEASE_NOTES_${TAG}.md" ]; then
            NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          elif [ -f "RELEASE_NOTES.md" ] && grep -q "${TAG}" RELEASE_NOTES.md; then
            NOTES_FILE="RELEASE_NOTES.md"
          fi

          if [ -n "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              --title "Database Workbench ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA" \
              "${EXTRA_ARGS[@]}" || true
          else
            gh release create "$TAG" \
              --title "Database Workbench ${TAG}" \
              --notes "Release ${TAG}" \
              --target "$GITHUB_SHA" \
              "${EXTRA_ARGS[@]}" || true
          fi

      - name: Upload installers to GitHub release
        run: |
          mapfile -t ALL_FILES < <(find artifacts -type f | sort)
          RELEASE_FILES=()
          for f in "${ALL_FILES[@]}"; do
            case "$f" in
              *.exe|*.msi|*.dmg|*.deb|*.rpm|*.AppImage|*.app.tar.gz|*.sig)
                RELEASE_FILES+=("$f")
                ;;
            esac
          done

          # Upload-artifact can keep duplicate basenames in different folders; dedupe them.
          declare -A SEEN
          UNIQUE_FILES=()
          for f in "${RELEASE_FILES[@]}"; do
            name=$(basename "$f")
            if [[ -z "${SEEN[$name]+x}" ]]; then
              SEEN[$name]=1
              UNIQUE_FILES+=("$f")
            fi
          done

          if [ ${#UNIQUE_FILES[@]} -eq 0 ]; then
            echo "::error::No release files found under artifacts/"
            exit 1
          fi
          gh release upload "${{ needs.check-version.outputs.tag }}" "${UNIQUE_FILES[@]}" --clobber

      - name: Generate latest.json
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="${{ needs.check-version.outputs.tag }}"
          NOTES=$(gh release view "$TAG" --json body --jq .body)
          node scripts/update-latest.mjs \
            --from-dir artifacts \
            --version "$VERSION" \
            --tag "$TAG" \
            --notes "$NOTES"

      - name: Upload latest.json to versioned GitHub release
        run: gh release upload "${{ needs.check-version.outputs.tag }}" latest.json --clobber

      - name: Upload latest.json to updater release
        if: needs.check-version.outputs.prerelease == 'false'
        run: |
          gh release upload update latest.json --clobber
