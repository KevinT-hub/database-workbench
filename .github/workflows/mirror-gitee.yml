name: Mirror release to Gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub release tag to mirror (default: latest release)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror release assets to Gitee
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITHUB_OWNER: KevinT-hub
      GITHUB_REPO: database-workbench
      GITEE_OWNER: kevint-hub
      GITEE_REPO: database-workbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release found to mirror"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download GitHub release assets
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts --clobber

      - name: Show artifacts
        run: find artifacts -type f -printf '%P\n' | sort

      - name: Mirror installers to Gitee release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          node scripts/gitee-release.mjs \
            --tag "$TAG" \
            --dir artifacts \
            --title "Database Workbench $TAG" \
            --notes "Mirrored from GitHub release $TAG."

      - name: Mirror latest.json to Gitee update channel
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES=$(gh release view "$TAG" --json body --jq .body)
          node scripts/update-latest.mjs \
            --from-dir artifacts \
            --version "$VERSION" \
            --tag "$TAG" \
            --notes "$NOTES"
          node scripts/gitee-release.mjs \
            --tag update \
            --dir update-gitee \
            --title "Auto-update channel" \
            --notes "Auto-generated latest.json for the stable update channel."
